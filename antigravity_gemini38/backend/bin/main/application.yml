server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: watchlater

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@192.168.45.2:1521/XEPDB1
    username: USERSTK9
    password: PwUserStk9
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: WLA_FLYWAY_HISTORY
    locations: classpath:db/migration

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: kr.co.tkinfo.watchlater.domain,kr.co.tkinfo.watchlater.dto
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: watchlaterSecretKeyForJwtTokenGenerationMustBeLongEnough20261008
  access-token-validity-in-seconds: 3600       # 1 hour
  refresh-token-validity-in-seconds: 604800   # 7 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
